<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web BedWars</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        overflow: hidden;
        background: #111;
        font-family: Arial, sans-serif;
        color: white;
    }

    canvas {
        display: block;
        background: #55a84f;
    }

    #ui {
        position: fixed;
        top: 15px;
        left: 15px;
        z-index: 10;
        background: rgba(0,0,0,.65);
        padding: 12px;
        border-radius: 10px;
    }

    #info {
        position: fixed;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,.65);
        padding: 10px 18px;
        border-radius: 10px;
    }
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
    ❤️ Vida: <span id="hp">100</span><br>
    ⚔️ Combo: <span id="combo">0</span><br>
    👾 Inimigos: <span id="enemies">0</span>
</div>

<div id="info">
    WASD = mover &nbsp; | &nbsp; Clique = atacar
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

const keys = {};

document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

const player = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    size: 25,
    speed: 4,
    hp: 100,
    combo: 0,
    attackCooldown: 0
};

let enemies = [];

function spawnEnemy() {

    let side = Math.floor(Math.random() * 4);
    let x, y;

    if(side === 0) {
        x = Math.random() * canvas.width;
        y = -40;
    }

    if(side === 1) {
        x = canvas.width + 40;
        y = Math.random() * canvas.height;
    }

    if(side === 2) {
        x = Math.random() * canvas.width;
        y = canvas.height + 40;
    }

    if(side === 3) {
        x = -40;
        y = Math.random() * canvas.height;
    }

    enemies.push({
        x,
        y,
        size: 25,
        hp: 100,
        speed: 1.2,
        knockX: 0,
        knockY: 0,
        hitTimer: 0
    });
}

setInterval(spawnEnemy, 1500);

document.addEventListener("mousedown", attack);

function attack() {

    if(player.attackCooldown > 0) return;

    player.attackCooldown = 18;

    let hit = false;

    enemies.forEach(enemy => {

        let dx = enemy.x - player.x;
        let dy = enemy.y - player.y;

        let distance = Math.sqrt(dx * dx + dy * dy);

        if(distance < 65) {

            hit = true;

            enemy.hp -= 25;
            enemy.hitTimer = 8;

            // KNOCKBACK
            let angle = Math.atan2(dy, dx);

            enemy.knockX = Math.cos(angle) * 14;
            enemy.knockY = Math.sin(angle) * 14;

            player.combo++;

            // combo reseta depois de um tempo
            clearTimeout(player.comboTimer);

            player.comboTimer = setTimeout(() => {
                player.combo = 0;
            }, 900);
        }
    });

    if(!hit) {
        player.combo = 0;
    }
}

function update() {

    // Movimento
    if(keys["w"]) player.y -= player.speed;
    if(keys["s"]) player.y += player.speed;
    if(keys["a"]) player.x -= player.speed;
    if(keys["d"]) player.x += player.speed;

    // Limites
    player.x = Math.max(20, Math.min(canvas.width - 20, player.x));
    player.y = Math.max(20, Math.min(canvas.height - 20, player.y));

    if(player.attackCooldown > 0)
        player.attackCooldown--;

    enemies.forEach(enemy => {

        // Knockback
        enemy.x += enemy.knockX;
        enemy.y += enemy.knockY;

        enemy.knockX *= 0.82;
        enemy.knockY *= 0.82;

        if(enemy.hitTimer > 0)
            enemy.hitTimer--;

        // IA simples: vem atrás do jogador
        let dx = player.x - enemy.x;
        let dy = player.y - enemy.y;

        let distance = Math.sqrt(dx * dx + dy * dy);

        if(distance > 35) {

            enemy.x += (dx / distance) * enemy.speed;
            enemy.y += (dy / distance) * enemy.speed;

        } else {

            // inimigo bate no jogador
            player.hp -= 0.15;

        }

    });

    // Remove inimigos mortos
    enemies = enemies.filter(enemy => enemy.hp > 0);

    if(player.hp <= 0) {
        player.hp = 100;
        enemies = [];
        player.combo = 0;
        alert("Você morreu! 😭");
    }

    document.getElementById("hp").textContent =
        Math.floor(player.hp);

    document.getElementById("combo").textContent =
        player.combo;

    document.getElementById("enemies").textContent =
        enemies.length;
}

function draw() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // GRAMA
    ctx.fillStyle = "#55a84f";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Ilha central
    ctx.fillStyle = "#c9a66b";
    ctx.fillRect(
        canvas.width/2 - 180,
        canvas.height/2 - 130,
        360,
        260
    );

    // cama
    ctx.fillStyle = "#e53935";
    ctx.fillRect(
        canvas.width/2 - 45,
        canvas.height/2 - 20,
        90,
        40
    );

    // PLAYER
    ctx.fillStyle = "#3498db";

    ctx.fillRect(
        player.x - player.size/2,
        player.y - player.size/2,
        player.size,
        player.size
    );

    // espada
    if(player.attackCooldown > 10) {

        ctx.strokeStyle = "white";
        ctx.lineWidth = 6;

        ctx.beginPath();

        ctx.moveTo(player.x, player.y);

        ctx.lineTo(
            player.x + 40,
            player.y - 25
        );

        ctx.stroke();
    }

    // INIMIGOS
    enemies.forEach(enemy => {

        ctx.fillStyle =
            enemy.hitTimer > 0 ? "white" : "#e74c3c";

        ctx.fillRect(
            enemy.x - enemy.size/2,
            enemy.y - enemy.size/2,
            enemy.size,
            enemy.size
        );

        // barra de vida
        ctx.fillStyle = "black";

        ctx.fillRect(
            enemy.x - 20,
            enemy.y - 25,
            40,
            5
        );

        ctx.fillStyle = "#2ecc71";

        ctx.fillRect(
            enemy.x - 20,
            enemy.y - 25,
            40 * (enemy.hp / 100),
            5
        );
    });
}

function gameLoop() {

    update();
    draw();

    requestAnimationFrame(gameLoop);
}

gameLoop();

</script>

</body>
</html>
