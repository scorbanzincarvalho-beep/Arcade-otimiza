```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sitefy AI</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* FUNDO */

.background {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}

.glow {
    position: absolute;
    width: 400px;
    height: 400px;
    background: #7c3cff;
    filter: blur(180px);
    opacity: .15;
    border-radius: 50%;
    left: 10%;
    top: 10%;
}

.glow2 {
    position: absolute;
    width: 350px;
    height: 350px;
    background: #a855f7;
    filter: blur(180px);
    opacity: .12;
    right: 5%;
    bottom: 5%;
    border-radius: 50%;
}

/* CHAT */

.chat {
    width: min(950px, 94vw);
    height: min(720px, 90vh);
    background: rgba(15, 15, 18, .88);
    border: 1px solid rgba(168, 85, 247, .25);
    border-radius: 25px;
    backdrop-filter: blur(25px);
    box-shadow: 0 30px 100px rgba(0,0,0,.6);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    z-index: 2;
}

/* HEADER */

.header {
    height: 75px;
    display: flex;
    align-items: center;
    padding: 0 25px;
    border-bottom: 1px solid rgba(255,255,255,.06);
}

.logo {
    width: 43px;
    height: 43px;
    border-radius: 14px;
    background: linear-gradient(135deg,#7c3cff,#a855f7);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 21px;
    font-weight: bold;
    box-shadow: 0 0 30px rgba(124,60,255,.35);
    margin-right: 14px;
}

.header h1 {
    font-size: 17px;
}

.status {
    font-size: 12px;
    color: #aaa;
    margin-top: 4px;
}

.online {
    color: #8b5cf6;
}

/* MENSAGENS */

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 30px;
    scroll-behavior: smooth;
}

.messages::-webkit-scrollbar {
    width: 5px;
}

.messages::-webkit-scrollbar-thumb {
    background: #292929;
    border-radius: 20px;
}

.message {
    display: flex;
    margin-bottom: 20px;
    animation: messageIn .35s ease;
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message.user {
    justify-content: flex-end;
}

.bubble {
    max-width: 75%;
    padding: 14px 17px;
    border-radius: 17px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
}

.bot .bubble {
    background: #17171b;
    border: 1px solid rgba(255,255,255,.06);
}

.user .bubble {
    background: linear-gradient(135deg,#6d28d9,#7c3aed);
}

/* DIGITANDO */

.typing {
    display: flex;
    gap: 5px;
    padding: 5px 2px;
}

.typing span {
    width: 6px;
    height: 6px;
    background: #a855f7;
    border-radius: 50%;
    animation: typing .9s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .15s;
}

.typing span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes typing {
    0%,100% {
        opacity: .2;
        transform: translateY(0);
    }

    50% {
        opacity: 1;
        transform: translateY(-4px);
    }
}

/* INPUT */

.input-area {
    padding: 18px;
    border-top: 1px solid rgba(255,255,255,.06);
}

.input-box {
    display: flex;
    align-items: center;
    background: #111114;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 17px;
    padding: 7px;
    transition: .25s;
}

.input-box:focus-within {
    border-color: rgba(168,85,247,.7);
    box-shadow: 0 0 25px rgba(124,60,255,.12);
}

textarea {
    flex: 1;
    resize: none;
    height: 44px;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    padding: 12px;
    font-size: 14px;
    font-family: inherit;
}

textarea::placeholder {
    color: #666;
}

.send {
    width: 45px;
    height: 45px;
    border: none;
    border-radius: 13px;
    background: linear-gradient(135deg,#7c3cff,#a855f7);
    color: white;
    cursor: pointer;
    font-size: 18px;
    transition: .2s;
}

.send:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px rgba(168,85,247,.4);
}

.send:active {
    transform: scale(.95);
}

.warning {
    text-align: center;
    color: #555;
    font-size: 10px;
    margin-top: 9px;
}

/* MOBILE */

@media(max-width:600px) {

    .chat {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
    }

    .messages {
        padding: 20px;
    }

    .bubble {
        max-width: 88%;
    }
}
</style>
</head>

<body>

<div class="background">
    <div class="glow"></div>
    <div class="glow2"></div>
</div>

<div class="chat">

    <div class="header">

        <div class="logo">
            S
        </div>

        <div>
            <h1>Sitefy AI</h1>
            <div class="status">
                <span class="online">●</span>
                Inteligência artificial online
            </div>
        </div>

    </div>

    <div class="messages" id="messages">

        <div class="message bot">
            <div class="bubble">
Olá! 👋

Eu sou a Sitefy AI.

Posso conversar com você, responder perguntas, ajudar com programação e dar ideias para seu site.

O que você quer fazer?
            </div>
        </div>

    </div>

    <div class="input-area">

        <div class="input-box">

            <textarea
                id="input"
                placeholder="Digite sua mensagem..."
                maxlength="2000"
            ></textarea>

            <button class="send" onclick="sendMessage()">
                ➤
            </button>

        </div>

        <div class="warning">
            Sitefy AI • versão experimental
        </div>

    </div>

</div>

<script>

/*
=================================================
CONFIGURAÇÃO
=================================================

ATENÇÃO:

NÃO coloque uma chave real de API aqui em um
site público.

Esta versão é apenas para teste.

Para produção, use um backend/serverless.
*/

const API_KEY = "COLOQUE_SUA_CHAVE_AQUI";

const MODEL = "gpt-4o-mini";


/*
=================================================
ELEMENTOS
=================================================
*/

const input = document.getElementById("input");
const messages = document.getElementById("messages");


/*
=================================================
HISTÓRICO
=================================================
*/

let conversation = [
    {
        role: "system",
        content:
        "Você é a Sitefy AI, uma inteligência artificial criada para o site Sitefy. Responda em português do Brasil. Seja útil, clara e amigável."
    }
];


/*
=================================================
ENTER
=================================================
*/

input.addEventListener("keydown", function(event) {

    if(event.key === "Enter" && !event.shiftKey) {

        event.preventDefault();

        sendMessage();

    }

});


/*
=================================================
ADICIONAR MENSAGEM
=================================================
*/

function addMessage(text, type) {

    const message = document.createElement("div");

    message.className = "message " + type;

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = text;

    message.appendChild(bubble);

    messages.appendChild(message);

    messages.scrollTop = messages.scrollHeight;

    return message;
}


/*
=================================================
LOADING
=================================================
*/

function addTyping() {

    const message = document.createElement("div");

    message.className = "message bot";

    message.id = "typing";

    message.innerHTML = `
        <div class="bubble">
            <div class="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    `;

    messages.appendChild(message);

    messages.scrollTop = messages.scrollHeight;
}


/*
=================================================
REMOVER LOADING
=================================================
*/

function removeTyping() {

    const typing = document.getElementById("typing");

    if(typing) {

        typing.remove();

    }

}


/*
=================================================
ENVIAR
=================================================
*/

async function sendMessage() {

    const text = input.value.trim();

    if(!text) return;

    if(API_KEY === "COLOQUE_SUA_CHAVE_AQUI") {

        addMessage(
            "A IA ainda não foi configurada. Adicione uma chave de API no código para testar.",
            "bot"
        );

        return;

    }


    addMessage(text, "user");

    input.value = "";

    conversation.push({
        role: "user",
        content: text
    });

    addTyping();


    try {

        const response = await fetch(
            "https://api.openai.com/v1/chat/completions",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + API_KEY
                },

                body: JSON.stringify({

                    model: MODEL,

                    messages: conversation,

                    temperature: 0.7

                })
            }
        );


        if(!response.ok) {

            throw new Error(
                "Erro da API: " + response.status
            );

        }


        const data = await response.json();

        const answer =
            data.choices?.[0]?.message?.content ||
            "Não consegui gerar uma resposta.";


        removeTyping();

        addMessage(answer, "bot");


        conversation.push({

            role: "assistant",

            content: answer

        });


    } catch(error) {

        console.error(error);

        removeTyping();

        addMessage(
            "Não consegui conectar à inteligência artificial. Verifique a configuração da API.",
            "bot"
        );

    }

}

</script>

</body>
</html>
```
